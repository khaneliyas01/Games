<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Flip a Coin — Realistic 3D coin flip animation. Free browser game on Eliyas Games.">
  <title>Flip a Coin — Eliyas Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .glow { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.15; pointer-events: none; z-index: 0; }
    .glow--1 { width: 500px; height: 500px; background: #F59E0B; top: -150px; right: -100px; animation: floatGlow 12s ease-in-out infinite; }
    .glow--2 { width: 400px; height: 400px; background: #8B5CF6; bottom: -100px; left: -100px; animation: floatGlow 15s ease-in-out infinite reverse; }
    @keyframes floatGlow { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-15px) scale(1.1); } }

    .back-link {
      position: fixed; top: 1.25rem; left: 1.25rem;
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1rem; border-radius: 10px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      color: #a0a0b8; font-size: 0.85rem; font-weight: 500;
      text-decoration: none; transition: all 200ms ease; z-index: 100;
      backdrop-filter: blur(12px);
    }
    .back-link:hover { color: #f0f0f5; border-color: rgba(139,92,246,0.4); background: rgba(139,92,246,0.1); }

    .game-container {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem; gap: 2rem;
    }

    .game-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900; text-align: center; letter-spacing: -0.02em;
    }
    .game-title span {
      background: linear-gradient(135deg, #F59E0B, #D97706);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* --- Coin --- */
    .coin-stage {
      width: 200px;
      height: 200px;
      perspective: 800px;
      margin: 1rem 0;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
    }

    .coin.flipping {
      animation: coinFlip 1s ease-out;
    }

    .coin.flipping-tails {
      animation: coinFlipTails 1s ease-out;
    }

    @keyframes coinFlip {
      0%   { transform: translateY(0)     rotateX(0deg); }
      30%  { transform: translateY(-180px) rotateX(720deg); }
      60%  { transform: translateY(-100px) rotateX(1260deg); }
      80%  { transform: translateY(-30px)  rotateX(1620deg); }
      100% { transform: translateY(0)      rotateX(1800deg); }
    }

    @keyframes coinFlipTails {
      0%   { transform: translateY(0)     rotateX(0deg); }
      30%  { transform: translateY(-180px) rotateX(720deg); }
      60%  { transform: translateY(-100px) rotateX(1260deg); }
      80%  { transform: translateY(-30px)  rotateX(1620deg); }
      100% { transform: translateY(0)      rotateX(1980deg); }
    }

    .coin-face {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      backface-visibility: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 2px 6px rgba(255,255,255,0.15);
    }

    .coin-heads {
      background: linear-gradient(145deg, #F59E0B, #D97706);
      color: #78350F;
      border: 4px solid rgba(255,255,255,0.15);
    }

    .coin-heads::before {
      content: '';
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid rgba(120, 53, 15, 0.25);
    }

    .coin-tails {
      background: linear-gradient(145deg, #D97706, #92400E);
      color: #FDE68A;
      border: 4px solid rgba(255,255,255,0.1);
      transform: rotateX(180deg);
    }

    .coin-tails::before {
      content: '';
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid rgba(253, 230, 138, 0.2);
    }

    .coin-label {
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .coin-emoji {
      display: block;
      font-size: 3.5rem;
      margin-bottom: 0.15rem;
      line-height: 1;
    }

    .coin-text {
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* --- Result --- */
    .result {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      min-height: 3rem;
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      transition: all 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .result.visible { opacity: 1; transform: translateY(0) scale(1); }
    .result.heads { color: #F59E0B; }
    .result.tails { color: #D97706; }

    /* --- Flip Button --- */
    .flip-btn {
      padding: 1rem 3rem; border-radius: 16px; border: none;
      background: linear-gradient(135deg, #F59E0B, #D97706);
      color: #78350F; font-family: 'Outfit', sans-serif;
      font-size: 1.2rem; font-weight: 700; cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease;
      box-shadow: 0 4px 24px rgba(245, 158, 11, 0.25);
    }
    .flip-btn:hover { transform: scale(1.05); box-shadow: 0 6px 32px rgba(245, 158, 11, 0.35); }
    .flip-btn:active { transform: scale(0.97); }
    .flip-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* --- Stats --- */
    .stats-row {
      display: flex; gap: 2rem; margin-top: 0.5rem;
    }
    .stat { text-align: center; }
    .stat-value { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; }
    .stat-value.heads-color { color: #F59E0B; }
    .stat-value.tails-color { color: #D97706; }
    .stat-label { font-size: 0.75rem; color: #6b6b80; text-transform: uppercase; letter-spacing: 0.08em; }

    /* --- Streak --- */
    .streak-bar {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 400px;
    }
    .streak-pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      animation: popIn 200ms ease-out both;
    }
    .streak-pip.heads { background: #F59E0B; box-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }
    .streak-pip.tails { background: #92400E; box-shadow: 0 0 8px rgba(146, 64, 14, 0.4); }
    @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

    @media (max-width: 480px) {
      .coin-stage { width: 150px; height: 150px; }
      .coin-face { width: 150px; height: 150px; }
      .coin-heads::before, .coin-tails::before { width: 120px; height: 120px; }
      .coin-emoji { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <div class="glow glow--1"></div>
  <div class="glow glow--2"></div>

  <a href="https://games.eliyas.xyz" class="back-link">← Back to Games</a>

  <div class="game-container">
    <h1 class="game-title">🪙 <span>Flip a Coin</span></h1>

    <div class="coin-stage">
      <div class="coin" id="coin">
        <div class="coin-face coin-heads">
          <div class="coin-label">
            <span class="coin-emoji">👑</span>
            <span class="coin-text">Heads</span>
          </div>
        </div>
        <div class="coin-face coin-tails">
          <div class="coin-label">
            <span class="coin-emoji">🦅</span>
            <span class="coin-text">Tails</span>
          </div>
        </div>
      </div>
    </div>

    <div class="result" id="result">—</div>

    <button class="flip-btn" id="flip-btn">🪙 Flip Coin</button>

    <div class="stats-row">
      <div class="stat">
        <div class="stat-value heads-color" id="heads-count">0</div>
        <div class="stat-label">Heads</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="total-flips">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat">
        <div class="stat-value tails-color" id="tails-count">0</div>
        <div class="stat-label">Tails</div>
      </div>
    </div>

    <div class="streak-bar" id="streak-bar"></div>
  </div>

  <script>
    const coin = document.getElementById('coin');
    const flipBtn = document.getElementById('flip-btn');
    const resultEl = document.getElementById('result');
    const headsCountEl = document.getElementById('heads-count');
    const tailsCountEl = document.getElementById('tails-count');
    const totalFlipsEl = document.getElementById('total-flips');
    const streakBar = document.getElementById('streak-bar');

    let heads = 0;
    let tails = 0;
    let isFlipping = false;

    function flipCoin() {
      if (isFlipping) return;
      isFlipping = true;
      flipBtn.disabled = true;
      resultEl.classList.remove('visible', 'heads', 'tails');

      const isHeads = Math.random() < 0.5;

      coin.classList.remove('flipping', 'flipping-tails');
      void coin.offsetWidth;
      coin.classList.add(isHeads ? 'flipping' : 'flipping-tails');

      setTimeout(() => {
        coin.classList.remove('flipping', 'flipping-tails');
        // Set final resting position
        coin.style.transform = isHeads ? 'rotateX(0deg)' : 'rotateX(180deg)';

        if (isHeads) {
          heads++;
          resultEl.textContent = '👑 Heads!';
          resultEl.classList.add('heads');
        } else {
          tails++;
          resultEl.textContent = '🦅 Tails!';
          resultEl.classList.add('tails');
        }

        resultEl.classList.add('visible');
        headsCountEl.textContent = heads;
        tailsCountEl.textContent = tails;
        totalFlipsEl.textContent = heads + tails;

        // Add streak pip
        const pip = document.createElement('div');
        pip.className = `streak-pip ${isHeads ? 'heads' : 'tails'}`;
        streakBar.insertBefore(pip, streakBar.firstChild);
        if (streakBar.children.length > 40) streakBar.removeChild(streakBar.lastChild);

        isFlipping = false;
        flipBtn.disabled = false;
      }, 1050);
    }

    flipBtn.addEventListener('click', flipCoin);
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); flipCoin(); }
    });
  </script>
</body>
</html>
