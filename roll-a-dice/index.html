<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Roll a Dice — Roll a realistic 3D dice with physics animation. Free browser game on Eliyas Games.">
  <title>Roll a Dice — Eliyas Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* --- Ambient Glow --- */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    .glow--1 { width: 500px; height: 500px; background: #F59E0B; top: -150px; left: -100px; animation: floatGlow 12s ease-in-out infinite; }
    .glow--2 { width: 400px; height: 400px; background: #EF4444; bottom: -100px; right: -100px; animation: floatGlow 15s ease-in-out infinite reverse; }

    @keyframes floatGlow {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.1); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* --- Back Link --- */
    .back-link {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #a0a0b8;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 200ms ease;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .back-link:hover { color: #f0f0f5; border-color: rgba(139,92,246,0.4); background: rgba(139,92,246,0.1); }

    /* --- Main Content --- */
    .game-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      gap: 2rem;
    }

    .game-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      text-align: center;
      letter-spacing: -0.02em;
    }
    .game-title span {
      background: linear-gradient(135deg, #F59E0B, #EF4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* --- Dice --- */
    .dice-scene {
      width: 160px;
      height: 160px;
      perspective: 600px;
      margin: 1rem 0;
    }

    .dice {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease;
    }

    .dice.rolling {
      animation: diceRoll 0.8s ease-out;
    }

    @keyframes diceRoll {
      0%   { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      20%  { transform: rotateX(200deg) rotateY(150deg) rotateZ(90deg); }
      40%  { transform: rotateX(400deg) rotateY(300deg) rotateZ(180deg); }
      60%  { transform: rotateX(600deg) rotateY(450deg) rotateZ(270deg); }
      80%  { transform: rotateX(720deg) rotateY(540deg) rotateZ(320deg); }
      100% { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(0deg); }
    }

    .dice-face {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 0;
      background: linear-gradient(145deg, #1a1a2e, #16162a);
      border: 2px solid rgba(245, 158, 11, 0.25);
      box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
    }

    .dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FBBF24, #F59E0B);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4), inset 0 -2px 4px rgba(0,0,0,0.3);
    }

    /* 3x3 grid layout for dots */
    .dice-face { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); place-items: center; }
    .dot { visibility: hidden; }
    .dot.visible { visibility: visible; }

    /* Face transforms */
    .face-1 { transform: rotateY(0deg)   translateZ(80px); }
    .face-2 { transform: rotateY(180deg) translateZ(80px); }
    .face-3 { transform: rotateY(-90deg) translateZ(80px); }
    .face-4 { transform: rotateY(90deg)  translateZ(80px); }
    .face-5 { transform: rotateX(90deg)  translateZ(80px); }
    .face-6 { transform: rotateX(-90deg) translateZ(80px); }

    /* --- Result Display --- */
    .result {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      min-height: 2.5rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 300ms ease;
    }
    .result.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .result-value {
      font-size: 3rem;
      background: linear-gradient(135deg, #F59E0B, #EF4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* --- Roll Button --- */
    .roll-btn {
      padding: 1rem 3rem;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #F59E0B, #EF4444);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease;
      box-shadow: 0 4px 24px rgba(245, 158, 11, 0.25);
    }
    .roll-btn:hover { transform: scale(1.05); box-shadow: 0 6px 32px rgba(245, 158, 11, 0.35); }
    .roll-btn:active { transform: scale(0.97); }
    .roll-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* --- History --- */
    .history {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 400px;
    }
    .history-item {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #F59E0B;
      animation: popIn 300ms ease-out both;
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .stats {
      display: flex;
      gap: 2rem;
      margin-top: 0.5rem;
    }
    .stat { text-align: center; }
    .stat-value {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: #F59E0B;
    }
    .stat-label { font-size: 0.75rem; color: #6b6b80; text-transform: uppercase; letter-spacing: 0.08em; }

    /* --- Responsive --- */
    @media (max-width: 480px) {
      .dice-scene { width: 120px; height: 120px; }
      .dice-face { width: 120px; height: 120px; border-radius: 14px; padding: 14px; }
      .dot { width: 20px; height: 20px; }
      .face-1 { transform: rotateY(0deg) translateZ(60px); }
      .face-2 { transform: rotateY(180deg) translateZ(60px); }
      .face-3 { transform: rotateY(-90deg) translateZ(60px); }
      .face-4 { transform: rotateY(90deg) translateZ(60px); }
      .face-5 { transform: rotateX(90deg) translateZ(60px); }
      .face-6 { transform: rotateX(-90deg) translateZ(60px); }
    }
  </style>
</head>
<body>
  <div class="glow glow--1"></div>
  <div class="glow glow--2"></div>

  <a href="https://games.eliyas.xyz" class="back-link">← Back to Games</a>

  <div class="game-container">
    <h1 class="game-title">🎲 <span>Roll a Dice</span></h1>

    <div class="dice-scene">
      <div class="dice" id="dice">
        <!-- Face 1 (front) -->
        <div class="dice-face face-1" data-face="1">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="dot"></span><span class="dot visible"></span><span class="dot"></span>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <!-- Face 6 (back) -->
        <div class="dice-face face-2" data-face="6">
          <span class="dot visible"></span><span class="dot"></span><span class="dot visible"></span>
          <span class="dot visible"></span><span class="dot"></span><span class="dot visible"></span>
          <span class="dot visible"></span><span class="dot"></span><span class="dot visible"></span>
        </div>
        <!-- Face 3 (left) -->
        <div class="dice-face face-3" data-face="3">
          <span class="dot"></span><span class="dot"></span><span class="dot visible"></span>
          <span class="dot"></span><span class="dot visible"></span><span class="dot"></span>
          <span class="dot visible"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <!-- Face 4 (right) -->
        <div class="dice-face face-4" data-face="4">
          <span class="dot visible"></span><span class="dot"></span><span class="dot visible"></span>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="dot visible"></span><span class="dot"></span><span class="dot visible"></span>
        </div>
        <!-- Face 2 (top) -->
        <div class="dice-face face-5" data-face="2">
          <span class="dot"></span><span class="dot"></span><span class="dot visible"></span>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="dot visible"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <!-- Face 5 (bottom) -->
        <div class="dice-face face-6" data-face="5">
          <span class="dot visible"></span><span class="dot"></span><span class="dot visible"></span>
          <span class="dot"></span><span class="dot visible"></span><span class="dot"></span>
          <span class="dot visible"></span><span class="dot"></span><span class="dot visible"></span>
        </div>
      </div>
    </div>

    <div class="result" id="result">
      You rolled a <span class="result-value" id="result-value">—</span>
    </div>

    <button class="roll-btn" id="roll-btn">🎲 Roll Dice</button>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="total-rolls">0</div>
        <div class="stat-label">Rolls</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="average">—</div>
        <div class="stat-label">Average</div>
      </div>
    </div>

    <div class="history" id="history"></div>
  </div>

  <script>
    const dice = document.getElementById('dice');
    const rollBtn = document.getElementById('roll-btn');
    const resultEl = document.getElementById('result');
    const resultValue = document.getElementById('result-value');
    const historyEl = document.getElementById('history');
    const totalRollsEl = document.getElementById('total-rolls');
    const averageEl = document.getElementById('average');

    let rolls = [];
    let isRolling = false;

    // Rotation map: which rotateX/Y shows which face at front
    const faceRotations = {
      1: { rx: 0,    ry: 0 },
      2: { rx: -90,  ry: 0 },
      3: { rx: 0,    ry: 90 },
      4: { rx: 0,    ry: -90 },
      5: { rx: 90,   ry: 0 },
      6: { rx: 0,    ry: 180 },
    };

    function rollDice() {
      if (isRolling) return;
      isRolling = true;
      rollBtn.disabled = true;
      resultEl.classList.remove('visible');

      const value = Math.floor(Math.random() * 6) + 1;
      const rot = faceRotations[value];

      // Add extra full rotations for dramatic effect
      const extraX = 720;
      const extraY = 720;
      const finalRx = rot.rx + extraX;
      const finalRy = rot.ry + extraY;

      dice.style.setProperty('--rx', finalRx + 'deg');
      dice.style.setProperty('--ry', finalRy + 'deg');

      dice.classList.remove('rolling');
      // Force reflow
      void dice.offsetWidth;
      dice.classList.add('rolling');

      setTimeout(() => {
        dice.style.transform = `rotateX(${rot.rx}deg) rotateY(${rot.ry}deg)`;
        dice.classList.remove('rolling');

        resultValue.textContent = value;
        resultEl.classList.add('visible');

        rolls.push(value);
        totalRollsEl.textContent = rolls.length;
        const avg = (rolls.reduce((a, b) => a + b, 0) / rolls.length).toFixed(1);
        averageEl.textContent = avg;

        const item = document.createElement('div');
        item.className = 'history-item';
        item.textContent = value;
        historyEl.insertBefore(item, historyEl.firstChild);

        // Keep last 20
        if (historyEl.children.length > 20) {
          historyEl.removeChild(historyEl.lastChild);
        }

        isRolling = false;
        rollBtn.disabled = false;
      }, 850);
    }

    rollBtn.addEventListener('click', rollDice);

    // Keyboard: space or enter to roll
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        rollDice();
      }
    });
  </script>
</body>
</html>
