<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simon Says — Repeat the growing sequence of colors and sounds. How long can you remember?">
  <title>Simon Says — Eliyas Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1f1510, #422006);
      color: #fff;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(520px, 100%);
      display: grid;
      gap: 18px;
      justify-items: center;
    }
    h1 { letter-spacing: 0.3px; }
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .pad {
      width: 160px; height: 160px;
      border-radius: 24px;
      border: 0;
      cursor: pointer;
      opacity: 0.85;
      transform: translateZ(0);
      transition: transform 120ms ease, opacity 120ms ease, filter 120ms ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .pad:active { transform: scale(0.97); }
    .pad.lit { opacity: 1; filter: brightness(1.35); transform: translateY(-4px); }
    .red { background: #ef4444; }
    .blue { background: #3b82f6; }
    .green { background: #22c55e; }
    .yellow { background: #facc15; color: #3f2e00; }
    .hud, .overlay {
      background: rgba(15, 15, 15, 0.6);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 14px 18px;
      backdrop-filter: blur(8px);
      text-align: center;
    }
    .hud { display: flex; gap: 18px; justify-content: center; }
    .hud div { min-width: 90px; }
    .overlay { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; }
    .overlay.show { display: flex; }
    .overlay-inner {
      background: rgba(15,15,15,0.85);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 22px 26px;
      display: grid; gap: 14px; justify-items: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      background: #f59e0b;
      color: #3f2e00;
    }
    a { color: #fbbf24; }
    .error-log {
      position: fixed;
      right: 12px; bottom: 12px;
      background: rgba(0,0,0,0.6);
      color: #ffddbb;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      max-width: 320px;
      z-index: 50;
    }
  </style>
</head>
<body>
  <main>
    <h1>Simon Says</h1>
    <div class="board" id="board">
      <button class="pad red" data-index="0" aria-label="Red"></button>
      <button class="pad blue" data-index="1" aria-label="Blue"></button>
      <button class="pad green" data-index="2" aria-label="Green"></button>
      <button class="pad yellow" data-index="3" aria-label="Yellow"></button>
    </div>
    <div class="hud">
      <div>Round <div id="round">0</div></div>
      <div>Best <div id="best">0</div></div>
      <div><button id="startBtn">Start</button></div>
    </div>
    <div class="overlay" id="overlay">
      <div class="overlay-inner">
        <div>
          <div style="font-size: 18px;">Game Over</div>
          <div style="opacity: 0.8;">You reached round <span id="finalRound">0</span></div>
        </div>
        <button id="restartBtn">Play Again</button>
      </div>
    </div>
    <a href="/../index.html">← Back to Games</a>
  </main>
  <div class="error-log" id="errorLog"></div>

  <script>
    const pads = [...document.querySelectorAll('.pad')];
    const roundEl = document.getElementById('round');
    const bestEl = document.getElementById('best');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const overlay = document.getElementById('overlay');
    const finalRound = document.getElementById('finalRound');
    const errorLog = document.getElementById('errorLog');
    const log = (...args) => { console.log(...args); appendError(args.join(' ')); };
    const appendError = (msg) => { if (!errorLog.textContent.trim()) errorLog.textContent = msg; else errorLog.textContent += '\n' + msg; };
    const clearLog = () => { errorLog.textContent = ''; };

    let sequence = [];
    let playerIndex = 0;
    let round = 0;
    let best = parseInt(localStorage.getItem('simon-best') || '0', 10);
    let inputLocked = true;
    const FLASH_MS = 260;
    const GAP_MS = 120;

    bestEl.textContent = best;

    async function playTone(index, duration=FLASH_MS) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        const freqs = [329.63, 261.63, 392.00, 220.00, 440.00, 293.66];
        osc.frequency.value = freqs[index] || 440;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration / 1000);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration / 1000);
      } catch (e) {
        log('Audio error:', e.message);
      }
    }

    function flashPad(index) {
      return new Promise(resolve => {
        const pad = pads[index];
        pad.classList.add('lit');
        playTone(index);
        setTimeout(() => pad.classList.remove('lit'), FLASH_MS);
        setTimeout(resolve, GAP_MS);
      });
    }

    async function playSequence() {
      inputLocked = true;
      await new Promise(r => setTimeout(r, 400));
      for (let i = 0; i < sequence.length; i++) {
        await flashPad(sequence[i]);
      }
      inputLocked = false;
    }

    function nextRound() {
      round++;
      sequence.push(Math.floor(Math.random() * 4));
      roundEl.textContent = round;
      playSequence().catch(err => log('Play seq error:', err.message));
    }

    function gameOver() {
      overlay.classList.add('show');
      finalRound.textContent = round;
      if (round > best) {
        best = round;
        bestEl.textContent = best;
        localStorage.setItem('simon-best', String(best));
      }
    }

    async function handlePad(index) {
      if (inputLocked) return;
      inputLocked = true;
      await flashPad(index);
      if (sequence[playerIndex] === index) {
        playerIndex++;
        if (playerIndex === sequence.length) {
          playerIndex = 0;
          inputLocked = true;
          setTimeout(nextRound, 900);
          return;
        }
        inputLocked = false;
        return;
      }
      log('Wrong pad at round', round, 'expected', sequence[playerIndex], 'got', index);
      gameOver();
    }

    function resetGame() {
      sequence = [];
      playerIndex = 0;
      round = 0;
      roundEl.textContent = 0;
      overlay.classList.remove('show');
      clearLog();
      nextRound();
    }

    pads.forEach((pad, idx) => pad.addEventListener('click', () => handlePad(idx)));
    startBtn.addEventListener('click', () => { if (!inputLocked || sequence.length === 0) resetGame(); });
    restartBtn.addEventListener('click', resetGame);
    window.addEventListener('keydown', (e) => {
      if (overlay.classList.contains('show') && (e.key === 'Enter' || e.key === ' ')) resetGame();
    });
  </script>
</body>
</html>
