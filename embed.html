<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed — Eliyas Games</title>
  <style>
    :root {
      --bg: #08080d;
      --surface: rgba(255, 255, 255, 0.03);
      --glow-1: #8B5CF6;
      --glow-2: #EC4899;
      --glow-3: #06B6D4;
      --text: #f0f0f5;
      --muted: #a0a0b8;
      --border: rgba(255, 255, 255, 0.08);
      --backdrop: rgba(10, 10, 15, 0.85);
      --font: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: radial-gradient(1200px 800px at 120px -120px, rgba(139, 92, 246, 0.15), transparent),
                  radial-gradient(900px 600px at calc(100% - 40px) calc(100% - 60px), rgba(236, 72, 153, 0.12), transparent),
                  radial-gradient(700px 500px at 50% 60%, rgba(6, 182, 212, 0.1), transparent),
                  var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      width: 100%;
      max-width: 980px;
      padding: 0.6rem 0.85rem;
      background: var(--backdrop);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .toolbar__brand {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .toolbar__brand mark {
      color: rgba(255, 255, 255, 0.35);
    }

    .toolbar__meta {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .game-frame {
      width: 100%;
      max-width: 980px;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #0c0c14;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .game-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .hint {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
    }
  </style>
</head>

<body>
  <div class="shell">
    <div class="toolbar" id="toolbar">
      <a class="toolbar__brand" href="https://games.eliyas.xyz" target="_top">
        Eliyas<span>.games</span>
      </a>
      <div class="toolbar__meta" id="game-name">Loading...</div>
    </div>

    <div class="game-frame" id="game-frame">
      <iframe id="game-iframe" title="Game" allow="autoplay; fullscreen; gamepad" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-pointer-lock"></iframe>
    </div>

    <div class="hint" id="hint">Want to embed this on your site? Use the URL in your address bar inside an iframe.</div>
  </div>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const game = String(params.get('game') || '').trim();

      const nameEl = document.getElementById('game-name');
      const iframe = document.getElementById('game-iframe');
      const frame = document.getElementById('game-frame');
      const hint = document.getElementById('hint');

      const escapeHtml = (text) => String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

      if (game) {
        const validNames = [
          'snake', 'tetris', 'pong', 'minesweeper', 'memory-match', '2048', 'rock-paper-scissors', 'typing-speed', 'roll-a-dice', 'flip-a-coin', 
          'draw-a-card', 'space-invaders', 'flappy-clone', 'tic-tac-toe', 'wordle-clone', 'hangman', 'trivia-quiz', 'idle-clicker', 'asteroids', 
          '15-puzzle', 'blackjack', 'solitaire', 'simon-says', 'connect-four', 'life', 'sudoku', 'tower-defense', 'reaction-time', 'word-scramble', 
          'endless-runner', 'rhythm-tap', 'math-sprint'
        ];
        const slug = validNames.find(n => n.toLowerCase() === game.toLowerCase());

        if (slug) {
          const src = './' + slug + '/';
          iframe.src = src;
          nameEl.textContent = validNames.find(n => n.toLowerCase() === slug) || slug;
        } else {
          frame.innerHTML = `
            <div class="empty-state">
              <h2>Unknown game</h2>
              <p style="color:#a0a0b8; margin-top:0.5rem;">"${escapeHtml(game)}" is not a supported game id.</p>
            </div>`;
          hint.textContent = '';
        }
      } else {
        frame.innerHTML = `
          <div class="empty-state">
            <h2>Missing game</h2>
            <p style="color:#a0a0b8; margin-top:0.5rem;">Pass ?game=snake or any supported game id.</p>
          </div>`;
        nameEl.textContent = 'No game selected';
        hint.textContent = '';
      }
    })();
  </script>
</body>
</html>
