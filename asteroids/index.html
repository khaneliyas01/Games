<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Asteroids — Pilot a ship through an asteroid field and blast rocks into smaller pieces.">
  <title>Asteroids — Eliyas Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html,body { height: 100%; }
    body {
      font-family: 'Space Mono', monospace;
      background: #05060f;
      color: #eaf2ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    canvas { display: block; background: radial-gradient(circle at 50% 50%, #0b0f24, #05060f); }
    .hud {
      position: fixed;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 20;
      font-family: 'Space Mono', monospace;
      color: #7ec9ff;
      font-size: 0.8rem;
      text-shadow: 0 0 10px rgba(126, 201, 255, 0.4);
    }
    .back-link {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #a0a0b8;
      text-decoration: none;
      z-index: 20;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      backdrop-filter: blur(10px);
    }
    .back-link:hover { color: #f0f0f5; border-color: rgba(126, 201, 255, 0.4); }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(5,6,15,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 30;
      color: #eaf2ff;
      font-family: 'Space Mono', monospace;
    }
    #overlay .ghost {
      color: #7ec9ff;
      opacity: 0.6;
    }
    .overlay__title { font-size: 1.8rem; font-weight: 700; letter-spacing: 0.05em; }
    .overlay__text { color: #a0a0b8; }
    .controls { color: #7ec9ff; font-size: 0.75rem; text-align: center; line-height: 1.7; opacity: 0.9; }
    .btn {
      padding: 0.6rem 1.3rem;
      border-radius: 10px;
      border: none;
      background: rgba(126, 201, 255, 0.18);
      color: #eaf2ff;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .btn:hover { background: rgba(126, 201, 255, 0.35); }
    .hud { display: flex; justify-content: space-between; padding: 1rem; }
    /* Mobile Controls */
    .mobile-controls {
      display: none; position: fixed; bottom: 1.5rem; left: 1rem; right: 1rem;
      justify-content: space-between; z-index: 25; touch-action: none; pointer-events: none;
    }
    .mobile-group { display: flex; gap: 0.5rem; pointer-events: auto; }
    .m-btn {
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(126, 201, 255, 0.15); border: 1px solid rgba(126, 201, 255, 0.3);
      color: rgba(234, 242, 255, 0.8); display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; cursor: pointer; user-select: none;
    }
    .m-btn:active { background: rgba(126, 201, 255, 0.35); }
    @media (max-width: 600px) { .mobile-controls { display: flex; } }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>LEVEL <span id="level">1</span></div>
    <div>LIVES <span id="lives">3</span></div>
  </div>
  <canvas id="gameCanvas" aria-label="Asteroids game"></canvas>
  <a href="https://games.eliyas.xyz" class="back-link">← Games</a>
  <div id="overlay">
    <div class="overlay__title">ASTEROIDS</div>
    <div class="controls">
      W/↑ thrust<br>
      A/D or ←/→ rotate<br>
      SPACE fire<br>
      P pause
    </div>
    <button class="btn" id="startBtn">START</button>
    <div class="ghost" id="status"></div>
  </div>
  
  <!-- Mobile Controls -->
  <div class="mobile-controls" id="mobileControls">
    <div class="mobile-group">
      <div class="m-btn" id="m-left">↺</div>
      <div class="m-btn" id="m-right">↻</div>
    </div>
    <div class="mobile-group">
      <div class="m-btn" id="m-fire">🎯</div>
      <div class="m-btn" id="m-thrust">🚀</div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const levelEl = document.getElementById('level');
      const livesEl = document.getElementById('lives');
      const overlay = document.getElementById('overlay');
      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('startBtn');

      let width, height;
      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const keys = {};
      window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === ' ') keys[' '] = true;
        if (e.key.toLowerCase() === 'p') togglePause();
      });
      window.addEventListener('keyup', e => {
        keys[e.key.toLowerCase()] = false;
        if (e.key === ' ') keys[' '] = false;
      });

      // Mobile touch bindings
      const bindBtn = (id, keyVal) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyVal] = true; }, { passive: false });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyVal] = false; }, { passive: false });
      };
      bindBtn('m-left', 'arrowleft');
      bindBtn('m-right', 'arrowright');
      bindBtn('m-thrust', 'arrowup');
      bindBtn('m-fire', ' ');

      const SHIP_SIZE = 18;
      const TURN_SPEED = 5.5;
      const THRUST = 0.12;
      const FRICTION = 0.992;
      const BULLET_SPEED = 10;
      const MAX_BULLETS = 8;
      const ASTEROID_VERTICES = [{x:-1,y:-1},{x:1,y:-1},{x:1,y:1},{x:-1,y:1}];

      let state = 'START';
      let score = 0;
      let level = 1;
      let lives = 3;
      let ship, bullets, asteroids, particles;
      let levelTransition = 0;
      let paused = false;

      function resetShip() {
        ship = {
          x: width/2, y: height/2,
          vx: 0, vy: 0,
          angle: -Math.PI/2,
          dead: 0
        };
      }

      function makeAsteroid(x, y, size) {
        const s = size || (32 + Math.random() * 36);
        const angle = Math.random()*Math.PI*2;
        const speed = (0.6 + Math.random()*0.8 + level*0.08);
        const verts = ASTEROID_VERTICES.map(p => ({ x: p.x + (Math.random()-0.5)*0.35, y: p.y + (Math.random()-0.5)*0.35 }));
        return { x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, size: s, verts, rot: 0, rotSpeed: (Math.random()-0.5)*0.04 };
      }

      function spawnLevel(n) {
        bullets = [];
        particles = [];
        const count = 3 + n + Math.floor(n/2);
        asteroids = [];
        for (let i = 0; i < count; i++) {
          let ax, ay;
          do {
            ax = Math.random()*width;
            ay = Math.random()*height;
          } while (dist(ax, ay, ship.x, ship.y) < 220);
          asteroids.push(makeAsteroid(ax, ay));
        }
      }

      function dist(x1,y1,x2,y2) { return Math.hypot(x2-x1, y2-y1); }

      function start() {
        state = 'PLAYING';
        paused = false;
        score = 0;
        level = 1;
        lives = 3;
        resetShip();
        spawnLevel(level);
        overlay.style.display = 'none';
      }

      function die() {
        if (ship.dead) return;
        ship.dead = 90;
        for (let i = 0; i < 18; i++) particles.push({ x: ship.x, y: ship.y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, life: 50 + Math.random()*40, max: 90 });
        statusEl.textContent = '';
        if (--lives <= 0) {
          setTimeout(() => {
            state = 'GAMEOVER';
            overlay.style.display = 'flex';
            statusEl.textContent = 'FINAL SCORE: ' + score;
            startBtn.textContent = 'RETRY';
          }, 700);
        } else {
          setTimeout(() => {
            resetShip();
            bullets = [];
          }, 900);
        }
      }

      function togglePause() {
        if (state !== 'PLAYING' || ship.dead) return;
        paused = !paused;
        overlay.style.display = paused ? 'flex' : 'none';
        statusEl.textContent = paused ? 'PAUSED' : '';
      }

      startBtn.addEventListener('click', () => {
        if (state === 'START' || state === 'GAMEOVER') start();
        else if (paused) togglePause();
      });

      let safeShots = 0;
      function updatePlaying() {
        if (paused) return;

        if (ship.dead > 0) {
          ship.dead--;
          if (ship.dead === 0 && lives <= 0) return;
        } else {
          if (keys['arrowleft'] || keys['a']) ship.angle -= TURN_SPEED/60;
          if (keys['arrowright'] || keys['d']) ship.angle += TURN_SPEED/60;
          if (keys['arrowup'] || keys['w']) {
            ship.vx += Math.cos(ship.angle)*THRUST;
            ship.vy += Math.sin(ship.angle)*THRUST;
            for (let i = 0; i < 1; i++) particles.push({ x: ship.x - Math.cos(ship.angle)*10, y: ship.y - Math.sin(ship.angle)*10, vx: (Math.random()-0.5)*2 - ship.vx*0.05, vy: (Math.random()-0.5)*2 - ship.vy*0.05, life: 30, max: 30 });
          }
          ship.vx *= FRICTION;
          ship.vy *= FRICTION;
          ship.x += ship.vx;
          ship.y += ship.vy;
          if (ship.x < 0) ship.x = width;
          if (ship.x > width) ship.x = 0;
          if (ship.y < 0) ship.y = height;
          if (ship.y > height) ship.y = 0;

          if (keys[' '] && bullets.length < MAX_BULLETS) {
            if (safeShots++ % 10 === 0) {
              bullets.push({ x: ship.x + Math.cos(ship.angle)*SHIP_SIZE, y: ship.y + Math.sin(ship.angle)*SHIP_SIZE, vx: Math.cos(ship.angle)*BULLET_SPEED + ship.vx, vy: Math.sin(ship.angle)*BULLET_SPEED + ship.vy, life: 70 });
            }
          }
        }

        bullets.forEach(b => {
          b.x += b.vx;
          b.y += b.vy;
          b.life--;
          if (b.x < 0) b.x = width;
          if (b.x > width) b.x = 0;
          if (b.y < 0) b.y = height;
          if (b.y > height) b.y = 0;
        });

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.98;
          p.vy *= 0.98;
          p.life--;
        });

        asteroids.forEach(a => {
          a.x += a.vx;
          a.y += a.vy;
          a.rot += a.rotSpeed;
          if (a.x < -a.size) a.x = width + a.size;
          if (a.x > width + a.size) a.x = -a.size;
          if (a.y < -a.size) a.y = height + a.size;
          if (a.y > height + a.size) a.y = -a.size;
        });

        bullets = bullets.filter(b => b.life > 0);
        particles = particles.filter(p => p.life > 0);

        for (let bi = bullets.length - 1; bi >= 0; bi--) {
          const b = bullets[bi];
          for (let ai = asteroids.length - 1; ai >= 0; ai--) {
            const a = asteroids[ai];
            if (dist(b.x, b.y, a.x, a.y) < a.size) {
              bullets.splice(bi, 1);
              const pts = Math.floor(a.size);
              score += pts;
              for (let i = 0; i < 12; i++) particles.push({ x: a.x, y: a.y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, life: 40+Math.random()*40, max: 80 });
              if (a.size < 22) {
                asteroids.splice(ai, 1);
              } else {
                for (let k = 0; k < 2; k++) {
                  asteroids.push(makeAsteroid(a.x, a.y, a.size/2));
                }
                asteroids.splice(ai, 1);
              }
              break;
            }
          }
        }

        if (ship.dead === 0) {
          for (const a of asteroids) {
            if (dist(a.x, a.y, ship.x, ship.y) < a.size + SHIP_SIZE*0.6) {
              die();
              break;
            }
          }
        }

        if (asteroids.length === 0) {
          level++;
          bullets = [];
          particles = [];
          if (ship.dead === 0) resetShip();
          spawnLevel(level);
        }

        scoreEl.textContent = score;
        levelEl.textContent = level;
        livesEl.textContent = lives;
      }

      function drawPlaying() {
        ctx.clearRect(0, 0, width, height);

        // stars
        const seed = 123;
        let hash = seed;
        for (let i = 0; i < 60; i++) {
          hash = ((hash << 5) - hash + i*131) | 0;
          const x = Math.abs(hash) % width;
          const y = Math.abs((hash >> 1)) % height;
          const r = (Math.abs(hash >> 2) % 2) === 0 ? 1.2 : 1.8;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(200,220,255,0.25)';
          ctx.fill();
        }

        if (!ship.dead) {
          ctx.save();
          ctx.translate(ship.x, ship.y);
          ctx.rotate(ship.angle + Math.PI/2);
          ctx.beginPath();
          ctx.moveTo(0, -SHIP_SIZE);
          ctx.lineTo(-SHIP_SIZE*0.7, SHIP_SIZE*0.7);
          ctx.lineTo(0, SHIP_SIZE*0.4);
          ctx.lineTo(SHIP_SIZE*0.7, SHIP_SIZE*0.7);
          ctx.closePath();
          ctx.strokeStyle = '#7ec9ff';
          ctx.lineWidth = 2;
          ctx.stroke();

          if (keys['arrowup'] || keys['w']) {
            ctx.beginPath();
            ctx.moveTo(0, SHIP_SIZE*0.4);
            ctx.lineTo(0, SHIP_SIZE*1.1);
            ctx.strokeStyle = '#ff9d5c';
            ctx.lineWidth = 3;
            ctx.stroke();
          }
          ctx.restore();
        }

        bullets.forEach(b => {
          ctx.beginPath();
          ctx.arc(b.x, b.y, 2, 0, Math.PI*2);
          ctx.fillStyle = '#fffce6';
          ctx.fill();
        });

        particles.forEach(p => {
          const alpha = p.life / p.max;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 1.2, 0, Math.PI*2);
          ctx.fillStyle = `rgba(255,157,92,${alpha})`;
          ctx.fill();
        });

        asteroids.forEach(a => {
          ctx.save();
          ctx.translate(a.x, a.y);
          ctx.rotate(a.rot);
          ctx.beginPath();
          a.verts.forEach((v,i) => i === 0 ? ctx.moveTo(v.x*a.size, v.y*a.size) : ctx.lineTo(v.x*a.size, v.y*a.size));
          ctx.closePath();
          ctx.strokeStyle = 'rgba(225,235,255,0.85)';
          ctx.lineWidth = 1.2;
          ctx.stroke();
          ctx.restore();
        });
      }

      function loop() {
        if (state === 'PLAYING') {
          updatePlaying();
          drawPlaying();
        }
        requestAnimationFrame(loop);
      }

      startBtn.addEventListener('click', () => {
        if (state === 'START' || state === 'GAMEOVER') start();
      });

      loop();
    })();
  </script>
</body>
</html>
