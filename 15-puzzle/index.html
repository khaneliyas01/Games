<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="15 Puzzle — Slide the numbered tiles into order. Free browser puzzle on Eliyas Games.">
  <title>15 Puzzle — Eliyas Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    .glow { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.15; pointer-events: none; z-index: 0; }
    .glow--1 { width: 500px; height: 500px; background: #EC4899; top: -150px; left: -100px; animation: floatGlow 12s ease-in-out infinite; }
    .glow--2 { width: 400px; height: 400px; background: #8B5CF6; bottom: -100px; right: -100px; animation: floatGlow 15s ease-in-out infinite reverse; }
    @keyframes floatGlow { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(25px, -20px) scale(1.09); } }

    .back-link {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #a0a0b8;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 200ms ease;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .back-link:hover { color: #f0f0f5; border-color: rgba(236, 72, 153, 0.4); background: rgba(236, 72, 153, 0.1); }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 6rem 1.5rem 2rem;
      gap: 1.1rem;
      max-width: 520px;
      width: 100%;
    }

    .header { text-align: center; width: 100%; }
    .header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #EC4899, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p { color: #6b6b80; font-size: 0.9rem; margin-top: 0.25rem; }

    .stats-bar {
      display: flex;
      gap: 1rem;
      justify-content: center;
      width: 100%;
    }
    .stat-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 0.5rem 1rem;
      border-radius: 12px;
      text-align: center;
      flex: 1;
      min-width: 80px;
    }
    .stat-card__label {
      font-size: 0.65rem;
      color: #6b6b80;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .stat-card__val {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: #f0f0f5;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1/1;
    }

    .tile {
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.4rem, 6vw, 2rem);
      font-weight: 900;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      color: #f0f0f5;
      cursor: pointer;
      user-select: none;
      transition: transform 90ms ease, background 120ms ease;
    }
    .tile:active { transform: scale(0.97); }
    .tile.empty {
      background: rgba(255,255,255,0.01);
      border-color: rgba(255,255,255,0.04);
      cursor: default;
      pointer-events: none;
    }
    .tile.win {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.55);
      color: #6ee7b7;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.18);
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      width: 100%;
    }

    .btn {
      padding: 0.75rem 2rem;
      border-radius: 12px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 150ms ease;
    }
    .btn--primary {
      background: linear-gradient(135deg, #EC4899, #8B5CF6);
      color: #fff;
      box-shadow: 0 4px 16px rgba(236,72,153,0.3);
    }
    .btn--primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(236,72,153,0.45); }
    .btn--ghost {
      background: rgba(255,255,255,0.05);
      color: #a0a0b8;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn--ghost:hover { color: #f0f0f5; background: rgba(255,255,255,0.08); }
    .help-hint { color: #6b6b80; font-size: 0.8rem; text-align: center; }

    .overlay {
      position: absolute;
      inset: -4px;
      border-radius: 20px;
      background: rgba(10,10,15,0.92);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: all 300ms ease;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 1.5rem;
      text-align: center;
    }
    .board-wrapper { position: relative; width: 100%; }
    .overlay.visible { opacity: 1; visibility: visible; }
    .overlay__emoji { font-size: 3.5rem; animation: floatEmoji 2s ease-in-out infinite; }
    .overlay__title {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      color: #f0f0f5;
    }
    .overlay__text { color: #a0a0b8; font-size: 0.95rem; line-height: 1.6; }

    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @media (max-width: 480px) {
      .container { padding: 5rem 1rem 1.5rem; gap: 1rem; }
      .board { max-width: 320px; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="glow glow--1"></div>
  <div class="glow glow--2"></div>
  <a href="https://games.eliyas.xyz" class="back-link">← Back to Games</a>

  <div class="container">
    <header class="header">
      <h1>15 Puzzle</h1>
      <p>Slide the tiles into numerical order. The blank moves the tiles.</p>
    </header>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-card__label">Moves</div>
        <div class="stat-card__val" id="moves">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Best</div>
        <div class="stat-card__val" id="best">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Status</div>
        <div class="stat-card__val" id="status">Playing</div>
      </div>
    </div>

    <div class="board-wrapper">
      <div class="board" id="board"></div>
      <div class="overlay" id="overlay">
        <div class="overlay__emoji" id="overlayEmoji">🏁</div>
        <div class="overlay__title" id="overlayTitle">Solved</div>
        <div class="overlay__text" id="overlayText">Nice.</div>
        <button class="btn btn--primary" id="shuffleBtn">Shuffle</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn--primary" id="shuffleBtnAlt">Shuffle</button>
      <button class="btn btn--ghost" id="solveBtn">Solve Hints</button>
    </div>
    <p class="help-hint">Desktop arrow keys also move the blank tile.</p>
  </div>

  <script>
    (function () {
      const boardEl = document.getElementById('board');
      const movesEl = document.getElementById('moves');
      const bestEl = document.getElementById('best');
      const statusEl = document.getElementById('status');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const overlayEmoji = document.getElementById('overlayEmoji');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const shuffleBtnAlt = document.getElementById('shuffleBtnAlt');
      const solveBtn = document.getElementById('solveBtn');

      let tiles = [];
      let empty = 15;
      let moves = 0;
      let best = +localStorage.getItem('p15-best') || null;
      let hints = false;

      function serialize() {
        return tiles.join(',');
      }

      function render(highlight) {
        boardEl.innerHTML = '';
        tiles.forEach((val, idx) => {
          const div = document.createElement('div');
          div.className = 'tile' + (val === 0 ? ' empty' : '') + (highlight ? (val === 0 ? '' : ' win') : '');
          if (val === 0) {
            div.textContent = '';
            div.dataset.empty = '1';
          } else {
            div.textContent = val;
            div.dataset.value = String(val);
          }
          div.dataset.index = String(idx);
          boardEl.appendChild(div);
        });
      }

      function isSolved() {
        for (let i = 0; i < 16; i++) if (tiles[i] !== i) return false;
        return true;
      }

      function setSolvedUI() {
        statusEl.textContent = 'Solved';
        overlayEmoji.textContent = '🎉';
        overlayTitle.textContent = 'You solved it!';
        overlayText.textContent = 'Moves: ' + moves + (best === moves ? ' — new best!' : '');
        best = best === null ? moves : Math.min(best, moves);
        localStorage.setItem('p15-best', String(best));
        bestEl.textContent = best;
        overlay.classList.add('visible');
        render(true);
      }

      function emptyNeighbors(idx) {
        const row = Math.floor(idx / 4);
        const col = idx % 4;
        const eR = Math.floor(empty / 4);
        const eC = empty % 4;
        const dr = eR - row;
        const dc = eC - col;
        return (Math.abs(dr) + Math.abs(dc) === 1) ? { dr, dc, eR, eC } : null;
      }

      function swap(idx) {
        const valid = emptyNeighbors(idx);
        if (!valid) return false;
        [tiles[empty], tiles[idx]] = [tiles[idx], tiles[empty]];
        empty = idx;
        moves += 1;
        movesEl.textContent = moves;
        render(false);
        return true;
      }

      function shuffle() {
        // perform valid random moves for scramble
        for (let i = 0; i < 220; i++) {
          const row = Math.floor(empty / 4);
          const col = empty % 4;
          const candidates = [];
          if (row > 0) candidates.push(empty - 4);
          if (row < 3) candidates.push(empty + 4);
          if (col > 0) candidates.push(empty - 1);
          if (col < 3) candidates.push(empty + 1);
          const pick = candidates[Math.floor(Math.random() * candidates.length)];
          [tiles[empty], tiles[pick]] = [tiles[pick], tiles[empty]];
          empty = pick;
        }
        moves = 0;
        movesEl.textContent = '0';
        statusEl.textContent = 'Playing';
        overlay.classList.remove('visible');
        render(false);
      }

      function onBoardClick(e) {
        const tile = e.target.closest('.tile[data-index]');
        if (!tile || tile.dataset.empty === '1') return;
        if (overlay.classList.contains('visible')) return;
        const idx = Number(tile.dataset.index);
        if (swap(idx)) {
          if (isSolved()) setSolvedUI();
        }
      }

      function onKeyDown(e) {
        if (!overlay.classList.contains('visible')) {
          if (e.key === 'ArrowUp') swap(empty + 4);
          else if (e.key === 'ArrowDown') swap(empty - 4);
          else if (e.key === 'ArrowLeft') swap(empty + 1);
          else if (e.key === 'ArrowRight') swap(empty - 1);
        }
        if (e.key.toLowerCase() === 'r' || e.key === 'F5') {
          if (e.key === 'F5') return;
          e.preventDefault();
          shuffle();
        }
      }

      boardEl.addEventListener('click', onBoardClick);
      document.addEventListener('keydown', onKeyDown);
      shuffleBtn.addEventListener('click', shuffle);
      shuffleBtnAlt.addEventListener('click', shuffle);
      solveBtn.addEventListener('click', () => {
        hints = !hints;
        solveBtn.textContent = hints ? 'Hide Hints' : 'Solve Hints';
        render(hints);
      });

      tiles = Array.from({ length: 16 }, (_, i) => i);
      empty = 15;
      shuffle();
      bestEl.textContent = best === null ? '--' : best;
    })();
  </script>
</body>
</html>
