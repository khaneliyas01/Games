<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Math Sprint — Solve arithmetic problems as fast as you can against the clock.">
  <title>Math Sprint — Eliyas Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #f0f0f5;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .back-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      color: #a0a0b8;
      text-decoration: none;
      font-size: 0.9rem;
      z-index: 100;
      transition: color 0.2s;
      background: rgba(10, 10, 15, 0.7);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      backdrop-filter: blur(8px);
    }
    .back-link:hover { color: #f0f0f5; }

    .game-container {
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .stats-row {
      display: flex;
      width: 100%;
      gap: 0.75rem;
    }

    .stat-card {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 0.6rem 0.5rem;
      text-align: center;
    }

    .stat-card .label {
      font-size: 0.65rem;
      color: #6b6b80;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-card .val {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .val-score { color: #22D3EE; }
    .val-timer { color: #F59E0B; }
    .val-timer.danger { color: #EF4444; }
    .val-streak { color: #10B981; }
    .val-level { color: #A78BFA; }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #22D3EE, #06B6D4);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .problem-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .problem-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.08), transparent 60%);
      pointer-events: none;
    }

    .problem-text {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 900;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .answer-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      position: relative;
    }

    .option-btn {
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 1rem;
      color: #f0f0f5;
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .option-btn:hover {
      background: rgba(34, 211, 238, 0.1);
      border-color: rgba(34, 211, 238, 0.4);
      transform: translateY(-2px);
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10B981;
      color: #10B981;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: #EF4444;
      color: #EF4444;
    }

    .feedback {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      min-height: 1.5rem;
      text-align: center;
    }

    .feedback.plus { color: #10B981; }
    .feedback.minus { color: #EF4444; }

    /* Game over screen */
    .game-over {
      text-align: center;
      padding: 2rem 0;
    }
    .game-over h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    .game-over .big-score {
      font-family: 'Outfit', sans-serif;
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(135deg, #22D3EE, #06B6D4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .game-over .details {
      color: #6b6b80;
      margin-top: 1rem;
      line-height: 1.8;
    }
    .restart-btn {
      margin-top: 1.5rem;
      background: linear-gradient(135deg, #0891B2, #22D3EE);
      border: none;
      border-radius: 12px;
      padding: 1rem 2rem;
      color: white;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .restart-btn:hover { transform: translateY(-2px); }

    /* Start screen */
    .start-screen {
      text-align: center;
    }
    .start-screen h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
    }
    .start-screen .emoji-big {
      font-size: 4rem;
      display: block;
      margin-bottom: 1rem;
    }
    .start-screen p { color: #a0a0b8; line-height: 1.6; margin-bottom: 1.5rem; }
    .start-btn {
      background: linear-gradient(135deg, #0891B2, #22D3EE);
      border: none;
      border-radius: 14px;
      padding: 1rem 2.5rem;
      color: white;
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .start-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(8, 145, 178, 0.4); }

    @media (max-width: 400px) {
      .stats-row { gap: 0.4rem; }
      .stat-card .val { font-size: 1.1rem; }
      .option-btn { padding: 0.75rem; font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <a href="https://games.eliyas.xyz" class="back-link">← Back to Games</a>

  <div class="game-container" id="game">
    <div class="start-screen">
      <span class="emoji-big">🧮</span>
      <h1>Math Sprint</h1>
      <p>Solve arithmetic problems as fast as you can!<br>Answer correctly to earn time. Wrong answers cost you.</p>
      <button class="start-btn" id="start-btn">Start Sprint</button>
    </div>
  </div>

  <script>
    const container = document.getElementById('game');

    let score = 0;
    let streak = 0;
    let bestStreak = 0;
    let level = 1;
    let timeLeft = 30;
    let timerId = null;
    let solved = 0;
    let wrong = 0;
    let currentAnswer = 0;
    let locked = false;

    function genProblem() {
      const ops = ['+', '-', '×'];
      let a, b, op, answer;

      if (level <= 3) {
        // Easy: single-digit add/subtract
        op = ops[Math.floor(Math.random() * 2)];
        a = Math.floor(Math.random() * 10) + 1;
        b = Math.floor(Math.random() * 10) + 1;
      } else if (level <= 6) {
        // Medium: bigger numbers, multiply
        op = ops[Math.floor(Math.random() * 3)];
        a = Math.floor(Math.random() * 20) + 5;
        b = Math.floor(Math.random() * 12) + 2;
      } else {
        // Hard
        op = ops[Math.floor(Math.random() * 3)];
        a = Math.floor(Math.random() * 50) + 10;
        b = Math.floor(Math.random() * 20) + 5;
      }

      if (op === '+') answer = a + b;
      else if (op === '-') { if (a < b) [a, b] = [b, a]; answer = a - b; }
      else { answer = a * b; }

      return { text: `${a} ${op} ${b}`, answer };
    }

    function genOptions(correct) {
      const options = new Set([correct]);
      while (options.size < 4) {
        let fake = correct + (Math.floor(Math.random() * 11) - 5);
        if (fake !== correct && fake >= 0) options.add(fake);
        else options.add(correct + Math.floor(Math.random() * 10) + 1);
      }
      return [...options].sort(() => Math.random() - 0.5);
    }

    function renderProblem() {
      const problem = genProblem();
      currentAnswer = problem.answer;
      const options = genOptions(problem.answer);
      locked = false;

      // Calculate level progress (every 5 correct answers)
      const progress = ((solved % 5) / 5) * 100;

      container.innerHTML = `
        <div class="stats-row">
          <div class="stat-card"><div class="label">Score</div><div class="val val-score">${score}</div></div>
          <div class="stat-card"><div class="label">Time</div><div class="val val-timer${timeLeft <= 5 ? ' danger' : ''}" id="timer">${timeLeft}s</div></div>
          <div class="stat-card"><div class="label">Streak</div><div class="val val-streak">${streak}🔥</div></div>
          <div class="stat-card"><div class="label">Level</div><div class="val val-level">${level}</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        <div class="problem-card">
          <div class="problem-text">${problem.text} = ?</div>
          <div class="answer-options">
            ${options.map(o => `<button class="option-btn" data-val="${o}">${o}</button>`).join('')}
          </div>
        </div>
        <div class="feedback" id="feedback"></div>
      `;

      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.val), btn));
      });
    }

    function handleAnswer(val, btn) {
      if (locked) return;
      locked = true;
      const feedback = document.getElementById('feedback');

      if (val === currentAnswer) {
        btn.classList.add('correct');
        streak++;
        if (streak > bestStreak) bestStreak = streak;
        const bonus = Math.min(streak, 5);
        score += 10 + bonus;
        solved++;
        timeLeft = Math.min(60, timeLeft + 3);
        feedback.textContent = `✓ +${10 + bonus} points!`;
        feedback.className = 'feedback plus';
        // Level up every 5 correct
        if (solved % 5 === 0) level++;
      } else {
        btn.classList.add('wrong');
        // Highlight correct
        document.querySelectorAll('.option-btn').forEach(b => {
          if (parseInt(b.dataset.val) === currentAnswer) b.classList.add('correct');
        });
        streak = 0;
        wrong++;
        timeLeft = Math.max(1, timeLeft - 3);
        feedback.textContent = `✗ Answer: ${currentAnswer}`;
        feedback.className = 'feedback minus';
      }

      setTimeout(renderProblem, 500);
    }

    function updateTimer() {
      const el = document.getElementById('timer');
      if (el) {
        el.textContent = timeLeft + 's';
        el.className = 'val val-timer' + (timeLeft <= 5 ? ' danger' : '');
      }
    }

    function startGame() {
      score = 0;
      streak = 0;
      bestStreak = 0;
      level = 1;
      timeLeft = 30;
      solved = 0;
      wrong = 0;

      renderProblem();

      timerId = setInterval(() => {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) {
          clearInterval(timerId);
          showGameOver();
        }
      }, 1000);
    }

    function showGameOver() {
      const accuracy = solved + wrong > 0 ? Math.round((solved / (solved + wrong)) * 100) : 0;
      container.innerHTML = `
        <div class="game-over">
          <h2>⏰ Time's Up!</h2>
          <div class="big-score">${score}</div>
          <p style="color:#a0a0b8">Points</p>
          <div class="details">
            Solved: <strong style="color:#10B981">${solved}</strong> &nbsp;|&nbsp;
            Wrong: <strong style="color:#EF4444">${wrong}</strong> &nbsp;|&nbsp;
            Accuracy: <strong style="color:#22D3EE">${accuracy}%</strong><br>
            Best streak: <strong style="color:#F59E0B">${bestStreak}</strong> &nbsp;|&nbsp;
            Level reached: <strong style="color:#A78BFA">${level}</strong>
          </div>
          <button class="restart-btn" id="restart-btn">Play Again</button>
        </div>
      `;
      document.getElementById('restart-btn').addEventListener('click', startGame);
    }

    // Init
    document.getElementById('start-btn').addEventListener('click', startGame);
  </script>
</body>
</html>
