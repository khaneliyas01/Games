<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play Rock Paper Scissors — Challenge the AI in a slick neon hand battle. Track streaks, win rates, and enjoy premium animations. Free on Eliyas Games.">
  <title>Rock Paper Scissors — Eliyas Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* --- Ambient Glow --- */
    .glow { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.15; pointer-events: none; z-index: 0; }
    .glow--1 { width: 500px; height: 500px; background: #3B82F6; top: -150px; left: -100px; animation: floatGlow 12s ease-in-out infinite; }
    .glow--2 { width: 400px; height: 400px; background: #EC4899; bottom: -100px; right: -100px; animation: floatGlow 15s ease-in-out infinite reverse; }
    @keyframes floatGlow { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(25px, -20px) scale(1.1); } }

    /* --- Back Link --- */
    .back-link {
      position: fixed; top: 1.25rem; left: 1.25rem;
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1rem; border-radius: 10px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      color: #a0a0b8; font-size: 0.85rem; font-weight: 500;
      text-decoration: none; transition: all 200ms ease; z-index: 100;
      backdrop-filter: blur(12px);
    }
    .back-link:hover { color: #f0f0f5; border-color: rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.1); }

    /* --- Layout Container --- */
    .container {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      padding: 5rem 1.5rem 2rem; gap: 1.5rem;
      max-width: 500px; width: 100%;
    }

    /* --- Header --- */
    .header { text-align: center; width: 100%; }
    .header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2rem, 6vw, 2.5rem);
      font-weight: 900; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #3B82F6, #EC4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header p { color: #6b6b80; font-size: 0.85rem; margin-top: 0.15rem; }

    /* --- Stats Bar --- */
    .stats-bar {
      display: flex; gap: 0.5rem; justify-content: center; width: 100%;
    }
    .stat-card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      padding: 0.5rem 0.75rem; border-radius: 12px; text-align: center; flex: 1; min-width: 75px;
    }
    .stat-card__label { font-size: 0.6rem; color: #6b6b80; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .stat-card__val { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 800; color: #f0f0f5; margin-top: 0.15rem; }
    .stat-card__val--win { color: #3B82F6; }

    /* --- Battleground Arena --- */
    .arena {
      position: relative; width: 100%; height: 260px;
      background: #12121a; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; overflow: hidden;
      display: flex; align-items: center; justify-content: space-around;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4); padding: 1rem;
    }

    .combatant {
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem; width: 45%;
    }
    .combatant__label { font-size: 0.75rem; color: #6b6b80; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
    .combatant__hand-wrap {
      width: 100px; height: 100px; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 50%; font-size: 4rem; position: relative;
    }

    /* Hand shake animations for dramatic battles */
    .combatant__hand-wrap.shaking-left { animation: shakeLeft 0.5s ease-in-out infinite; }
    .combatant__hand-wrap.shaking-right { animation: shakeRight 0.5s ease-in-out infinite; }

    @keyframes shakeLeft {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(-15deg) translateY(-10px); }
    }
    @keyframes shakeRight {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(15deg) translateY(-10px); }
    }

    .vs-sign {
      font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 900;
      color: rgba(255,255,255,0.1);
    }

    /* --- Status / Result HUD --- */
    .hud {
      font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800;
      text-align: center; min-height: 2.2rem; display: flex; align-items: center; justify-content: center;
    }
    .hud--win { color: #3B82F6; }
    .hud--loss { color: #EC4899; }
    .hud--draw { color: #a0a0b8; }

    /* --- Selection Controls --- */
    .selectors {
      display: flex; gap: 1rem; width: 100%; justify-content: center;
    }
    .select-btn {
      width: 90px; height: 90px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02); font-size: 2.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 250ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .select-btn:hover {
      transform: scale(1.1); background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
    }
    .select-btn:active { transform: scale(0.95); }
    .select-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .help-hint {
      text-align: center; color: #6b6b80; font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="glow glow--1"></div>
  <div class="glow glow--2"></div>

  <a href="https://games.eliyas.xyz" class="back-link">← Back to Games</a>

  <div class="container">
    <header class="header">
      <h1>Rock Paper Scissors</h1>
      <p>Challenge the computer in a hand duel</p>
    </header>

    <!-- Score HUD Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-card__label">Wins</div>
        <div class="stat-card__val stat-card__val--win" id="stat-wins">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Ties</div>
        <div class="stat-card__val" id="stat-ties">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Losses</div>
        <div class="stat-card__val" id="stat-losses">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Win Rate</div>
        <div class="stat-card__val" id="stat-rate">0%</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Streak</div>
        <div class="stat-card__val" id="stat-streak">0</div>
      </div>
    </div>

    <!-- Combat Board -->
    <div class="arena">
      <div class="combatant">
        <span class="combatant__label">You</span>
        <div class="combatant__hand-wrap" id="player-hand">✊</div>
      </div>

      <div class="vs-sign">VS</div>

      <div class="combatant">
        <span class="combatant__label">Computer</span>
        <div class="combatant__hand-wrap" id="computer-hand">✊</div>
      </div>
    </div>

    <!-- Round HUD info -->
    <div class="hud" id="hud-status">Choose your weapon!</div>

    <!-- Hand Selector Buttons -->
    <div class="selectors">
      <button class="select-btn" id="btn-rock" data-choice="rock">✊</button>
      <button class="select-btn" id="btn-paper" data-choice="paper">✋</button>
      <button class="select-btn" id="btn-scissors" data-choice="scissors">✌️</button>
    </div>

    <div class="help-hint">
      Rock beats Scissors. Scissors beats Paper. Paper beats Rock.<br>
      Tap any button to strike!
    </div>
  </div>

  <script>
    // ─── Web Audio Synthesizer ──────────────────────────────────────────────────
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'click') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'win') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16); // G5
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } else if (type === 'loss') {
        osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
        osc.frequency.linearRampToValueAtTime(146.83, audioCtx.currentTime + 0.3); // D3
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } else if (type === 'tie') {
        osc.frequency.setValueAtTime(330, audioCtx.currentTime); // E4
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      }
    }

    // ─── Game Logic ─────────────────────────────────────────────────────────────
    let wins = 0;
    let ties = 0;
    let losses = 0;
    let streak = 0;
    let playing = false;

    const emojiMap = {
      rock: '✊',
      paper: '✋',
      scissors: '✌️'
    };

    // DOM Elements
    const playerHand = document.getElementById('player-hand');
    const computerHand = document.getElementById('computer-hand');
    const hudStatus = document.getElementById('hud-status');
    const statWins = document.getElementById('stat-wins');
    const statTies = document.getElementById('stat-ties');
    const statLosses = document.getElementById('stat-losses');
    const statRate = document.getElementById('stat-rate');
    const statStreak = document.getElementById('stat-streak');

    const selectButtons = document.querySelectorAll('.select-btn');

    function updateStats() {
      statWins.textContent = wins;
      statTies.textContent = ties;
      statLosses.textContent = losses;
      statStreak.textContent = streak;

      const total = wins + ties + losses;
      if (total > 0) {
        const rate = Math.round((wins / total) * 100);
        statRate.textContent = `${rate}%`;
      } else {
        statRate.textContent = '0%';
      }
    }

    function fight(playerChoice) {
      if (playing) return;
      playing = true;
      playSound('click');

      // Disable buttons
      selectButtons.forEach(btn => btn.disabled = true);

      // Reset hands to default rocks and start shaking animation
      playerHand.textContent = '✊';
      computerHand.textContent = '✊';
      playerHand.classList.add('shaking-left');
      computerHand.classList.add('shaking-right');

      hudStatus.className = 'hud';
      hudStatus.textContent = 'Rock... Paper... Scissors...';

      const choices = ['rock', 'paper', 'scissors'];
      const computerChoice = choices[Math.floor(Math.random() * choices.length)];

      setTimeout(() => {
        // Stop animations
        playerHand.classList.remove('shaking-left');
        computerHand.classList.remove('shaking-right');

        // Reveal selections
        playerHand.textContent = emojiMap[playerChoice];
        computerHand.textContent = emojiMap[computerChoice];

        // Determine outcome
        if (playerChoice === computerChoice) {
          hudStatus.textContent = "It's a draw!";
          hudStatus.className = 'hud hud--draw';
          ties++;
          streak = 0;
          playSound('tie');
        } else if (
          (playerChoice === 'rock' && computerChoice === 'scissors') ||
          (playerChoice === 'paper' && computerChoice === 'rock') ||
          (playerChoice === 'scissors' && computerChoice === 'paper')
        ) {
          hudStatus.textContent = 'You win the round!';
          hudStatus.className = 'hud hud--win';
          wins++;
          streak++;
          playSound('win');
        } else {
          hudStatus.textContent = 'Computer wins!';
          hudStatus.className = 'hud hud--loss';
          losses++;
          streak = 0;
          playSound('loss');
        }

        updateStats();

        // Enable buttons after delay
        setTimeout(() => {
          selectButtons.forEach(btn => btn.disabled = false);
          playing = false;
        }, 600);

      }, 1500); // Shaking time
    }

    // Set selectors click handlers
    document.querySelectorAll('.select-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        fight(btn.dataset.choice);
      });
    });

    // Boot
    updateStats();
  </script>
</body>
</html>
